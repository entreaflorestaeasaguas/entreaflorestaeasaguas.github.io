<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Entre a Floresta e as Águas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #071510;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
    }

    .site {
      position: relative;
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
    }

    .site-image {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      Áreas clicáveis transparentes.
      Elas ficam sobre a imagem sem alterar o visual.
    */

    .link {
      position: absolute;
      display: block;
      background: transparent;
      border: 0;
      cursor: pointer;
      text-decoration: none;
    }

    /* MENU SUPERIOR */

    .inicio {
      top: 0.5%;
      left: 8%;
      width: 8%;
      height: 3%;
    }

    .historia-menu {
      top: 0.5%;
      left: 16%;
      width: 10%;
      height: 3%;
    }

    .personagens-menu {
      top: 0.5%;
      left: 26%;
      width: 11%;
      height: 3%;
    }

    .mundo-menu {
      top: 0.5%;
      left: 37%;
      width: 9%;
      height: 3%;
    }

    .leia-menu {
      top: 0.5%;
      left: 46%;
      width: 6%;
      height: 3%;
    }

    .apoie-menu {
      top: 0.5%;
      left: 52%;
      width: 7%;
      height: 3%;
    }

    .diario-menu {
      top: 0.5%;
      left: 58%;
      width: 8%;
      height: 3%;
    }

    /* BOTÃO ENTRAR NO UNIVERSO */

    .entrar {
      top: 30.8%;
      left: 35%;
      width: 30%;
      height: 4.5%;
      border-radius: 40px;
    }

    /* CINCO CARTÕES */

    .card-historia {
      top: 38%;
      left: 3%;
      width: 18%;
      height: 20%;
      border-radius: 40px;
    }

    .card-personagens {
      top: 38%;
      left: 23%;
      width: 18%;
      height: 20%;
      border-radius: 40px;
    }

    .card-mundo {
      top: 38%;
      left: 43%;
      width: 18%;
      height: 20%;
      border-radius: 40px;
    }

    .card-leia {
      top: 38%;
      left: 63%;
      width: 18%;
      height: 20%;
      border-radius: 40px;
    }

    .card-apoie {
      top: 38%;
      left: 83%;
      width: 16%;
      height: 20%;
      border-radius: 40px;
    }

    /* CAPÍTULOS */

    .capitulo-1 {
      top: 70%;
      left: 4%;
      width: 19%;
      height: 11%;
    }

    .capitulo-2 {
      top: 70%;
      left: 24%;
      width: 19%;
      height: 11%;
    }

    .capitulo-3 {
      top: 70%;
      left: 45%;
      width: 19%;
      height: 11%;
    }

    /* PLANOS */

    .planos {
      top: 69%;
      left: 66%;
      width: 30%;
      height: 12%;
      border-radius: 30px;
    }

    /* EFEITO AO PASSAR O MOUSE */

    .link:hover {
      background: rgba(255, 255, 255, 0.08);
      outline: 1px solid rgba(225, 199, 124, 0.5);
    }

    /* CELULAR */

    @media (max-width: 600px) {

      .link:hover {
        background: transparent;
        outline: none;
      }

    }
  </style>
</head>

<body>

  <div class="site">

    <img
      src="1000330519.jpg"
      alt="Entre a Floresta e as Águas"
      class="site-image"
    >

    <!-- MENU -->

    <a href="#inicio" class="link inicio" aria-label="Início"></a>

    <a href="#historia" class="link historia-menu" aria-label="A História"></a>

    <a href="#personagens" class="link personagens-menu" aria-label="Personagens"></a>

    <a href="#mundo" class="link mundo-menu" aria-label="O Mundo"></a>

    <a href="#leia" class="link leia-menu" aria-label="Leia"></a>

    <a href="#apoie" class="link apoie-menu" aria-label="Apoie"></a>

    <a href="#diario" class="link diario-menu" aria-label="Diário"></a>


    <!-- ENTRAR NO UNIVERSO -->

    <a href="#historia"
       class="link entrar"
       aria-label="Entrar no universo">
    </a>


    <!-- CARTÕES -->

    <a href="#historia"
       class="link card-historia"
       aria-label="A História">
    </a>

    <a href="#personagens"
       class="link card-personagens"
       aria-label="Personagens">
    </a>

    <a href="#mundo"
       class="link card-mundo"
       aria-label="O Mundo">
    </a>

    <a href="#leia"
       class="link card-leia"
       aria-label="Leia">
    </a>

    <a href="#apoie"
       class="link card-apoie"
       aria-label="Apoie">
    </a>


    <!-- CAPÍTULOS -->

    <a href="#capitulo1"
       class="link capitulo-1"
       aria-label="Capítulo 1">
    </a>

    <a href="#capitulo2"
       class="link capitulo-2"
       aria-label="Capítulo 2">
    </a>

    <a href="#capitulo3"
       class="link capitulo-3"
       aria-label="Capítulo 3">
    </a>


    <!-- PLANOS -->

    <a href="#apoie"
       class="link planos"
       aria-label="Conheça os planos">
    </a>

  </div>

</body>
</html>
